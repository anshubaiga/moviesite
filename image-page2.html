<!DOCTYPE html>
<html lang="en">
<head>
  <!-- App theme color (status bar color on mobile) -->
  <meta name="theme-color" content="#0c0d0d" />
  <meta charset="UTF-8">
  <title>Album</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>

<header class="top-bar">
  <div><a href="https://story.anshubaiga.com/image">? Back to albums</a></div>
  <div>TRAVEL ALBUM</div>
</header>

<main class="main">
  <h2 class="album-title">Travel Album</h2>

  <section class="gallery">
    <div class="gallery-item">
      <img src="https://images.pexels.com/photos/210205/pexels-photo-210205.jpeg" alt="">
    </div>
    <div class="gallery-item">
      <img src="https://images.pexels.com/photos/462162/pexels-photo-462162.jpeg" alt="">
    </div>
    <div class="gallery-item">
      <img src="https://images.pexels.com/photos/247322/pexels-photo-247322.jpeg" alt="">
    </div>
    <div class="gallery-item tall">
      <img src="https://images.pexels.com/photos/2486168/pexels-photo-2486168.jpeg" alt="">
    </div>
    <div class="gallery-item wide">
      <img src="https://images.pexels.com/photos/3771839/pexels-photo-3771839.jpeg" alt="">
    </div>
    <div class="gallery-item">
      <img src="https://images.pexels.com/photos/378570/pexels-photo-378570.jpeg" alt="">
    </div>
  </section>
</main>

<!-- Lightbox -->
<div class="lightbox">
  <span class="lightbox-close">&times;</span>
  <img src="" alt="">
</div>

<script src="script.js"></script>
</body>
</html>
