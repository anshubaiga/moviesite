<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photo Collection</title>
  <meta name="viewport" content="width=device-width, 

initial-scale=1.0" />
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?

family=Poppins:wght@300;400;600&display=swap" 

rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #121212;
      color: #f5f5f5;
      font-family: "Poppins", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Page wrapper */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    .top-bar {
      padding: 20px 6vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .menu-icon {
      width: 18px;
      height: 2px;
      background: #fff;
      position: relative;
    }

    .menu-icon::before,
    .menu-icon::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: #fff;
    }

    .menu-icon::before {
      top: -6px;
    }

    .menu-icon::after {
      top: 6px;
    }

    /* Main content */
    .main {
      flex: 1;
      padding: 30px 6vw 60px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .headline {
      margin-bottom: 40px;
    }

    .headline p {
      font-size: 26px;
      font-weight: 300;
      line-height: 1.4;
      color: #c8c8c8;
    }

    .headline a {
      display: inline-block;
      margin-top: 10px;
      font-size: 22px;
      font-weight: 600;
      border-bottom: 2px solid #f5f5f5;
    }

    /* Gallery grid */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 6px;
      background: #1e1e1e;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
    }

    /* Different heights (to look like screenshot) */
    .gallery-item.tall {
      grid-row: span 2;
    }

    .gallery-item.wide {
      grid-column: span 2;
    }

    /* Load more button */
    .load-more-wrap {
      text-align: center;
      margin: 40px 0 30px;
    }

    .load-more {
      display: inline-block;
      padding: 12px 40px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #181818;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .load-more:hover {
      background: #222;
      transform: translateY(-1px);
    }

    /* Footer */
    footer {
      padding: 20px 6vw 30px;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #9c9c9c;
    }

    .footer-links {
      display: flex;
      gap: 10px;
    }

    .circle-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }

      .headline p {
        font-size: 22px;
      }
    }

    @media (max-width: 600px) {
      .top-bar {
        padding: 16px 16px;
      }

      .main {
        padding: 20px 16px 40px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .headline p {
        font-size: 20px;
      }

      .headline a {
        font-size: 18px;
      }

      .gallery-item.tall,
      .gallery-item.wide {
        grid-column: span 1;
        grid-row: span 1;
      }

      footer {
        padding: 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Top bar -->
    <header class="top-bar">
      <div>MIKE WELLY</div>
      <div class="menu-icon"></div>
    </header>

    <!-- Main content -->
    <main class="main">
      <section class="headline">
        <p>You’re now browsing Mike’s<br>Photos 

Collection</p>
        <a href="#">All albums</a>
      </section>

      <!-- Gallery -->
      <section class="gallery">
        <!-- Row 1 -->
        <div class="gallery-item">
          <img 

src="https://images.pexels.com/photos/378570/pexels-photo-

378570.jpeg" alt="City" />
        </div>
        <div class="gallery-item">
          <img 

src="https://images.pexels.com/photos/247322/pexels-photo-

247322.jpeg" alt="Field" />
        </div>
        <div class="gallery-item">
          <img 

src="https://images.pexels.com/photos/3771839/pexels-photo-

3771839.jpeg" alt="Hands" />
        </div>

        <!-- Row 2 -->
        <div class="gallery-item tall">
          <img 

src="https://images.pexels.com/photos/1061613/pexels-photo-

1061613.jpeg" alt="Window" />
        </div>
        <div class="gallery-item">
          <img 

src="https://images.pexels.com/photos/414612/pexels-photo-

414612.jpeg" alt="Flowers" />
        </div>
        <div class="gallery-item tall">
          <img 

src="https://images.pexels.com/photos/2101187/pexels-photo-

2101187.jpeg" alt="Architecture" />
        </div>

        <!-- Row 3 -->
        <div class="gallery-item wide">
          <img 

src="https://images.pexels.com/photos/462162/pexels-photo-

462162.jpeg" alt="Sea" />
        </div>
        <div class="gallery-item wide">
          <img 

src="https://images.pexels.com/photos/210205/pexels-photo-

210205.jpeg" alt="Bridge" />
        </div>

        <!-- Row 4 -->
        <div class="gallery-item">
          <img 

src="https://images.pexels.com/photos/1169084/pexels-photo-

1169084.jpeg" alt="Macro" />
        </div>
        <div class="gallery-item">
          <img 

src="https://images.pexels.com/photos/2486168/pexels-photo-

2486168.jpeg" alt="Sunset" />
        </div>
        <div class="gallery-item">
          <img 

src="https://images.pexels.com/photos/428340/pexels-photo-

428340.jpeg" alt="Portrait" />
        </div>
      </section>

      <!-- Load more -->
      <div class="load-more-wrap">
        <button class="load-more">+ Load more</button>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <div>
        Siena, Made by <a href="#" style="text-decoration: 

underline;">Your Name</a>
      </div>
      <div class="footer-links">
        <div class="circle-icon">T</div>
        <div class="circle-icon">F</div>
        <div class="circle-icon">I</div>
      </div>
    </footer>
  </div>
</body>
</html>
