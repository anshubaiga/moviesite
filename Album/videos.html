<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Album</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
  <div><a href="index.html">? Back to albums</a></div>
  <div>VIDEO ALBUM</div>
</header>

<main class="main">
  <h2 class="album-title">Video Album</h2>

  <section class="video-grid">
    <!-- YouTube embeds or your own MP4s -->
    <div class="video-card">
      <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"
              title="Video 1"
              allowfullscreen></iframe>
      <div class="video-title">City timelapse</div>
    </div>

    <div class="video-card">
      <iframe src="https://www.youtube.com/embed/kXYiU_JCYtU"
              title="Video 2"
              allowfullscreen></iframe>
      <div class="video-title">Sunset walk</div>
    </div>

    <!-- Example with your own video file -->
    <div class="video-card">
      <video controls>
        <source src="videos/sample.mp4" type="video/mp4">
      </video>
      <div class="video-title">My local street vlog</div>
    </div>
  </section>
</main>

</body>
</html>
