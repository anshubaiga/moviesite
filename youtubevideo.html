<!DOCTYPE html>
<html lang="en">
<head>
  <!-- App theme color (status bar color on mobile) -->
  <meta name="theme-color" content="#0f172a" />
  <meta charset="UTF-8">
  <title>Video Album — Thumbnails</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #0f172a;
      --card: #071026;
      --muted: rgba(255,255,255,0.78);
      --accent: #E3910B;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071226 0%, #0f172a 100%);color:#eef2ff}
    a{color:var(--muted); text-decoration:none}
    .top-bar{
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 18px;background:rgba(255,255,255,0.02);backdrop-filter: blur(6px);
      border-bottom:1px solid rgba(255,255,255,0.03);
    }
    .main{max-width:1100px;margin:18px auto;padding:18px}
    .album-title{margin:6px 0 16px;font-weight:600;letter-spacing:0.4px}
    .video-grid{
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap:18px;
    }

    /* video card */
    .video-card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:10px;
      border:1px solid rgba(255,255,255,0.03);
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .media-wrap{
      position:relative;
      width:100%;
      aspect-ratio: 16/9;
      background:#000;
      border-radius:8px;
      overflow:hidden;
    }

    /* thumbnail image */
    .thumb{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
      cursor:pointer;transition:transform .18s ease;
    }
    .thumb:hover{transform:scale(1.03)}

    /* play overlay */
    .play-overlay{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      background: rgba(0,0,0,0.45);
      border-radius:999px;padding:14px;display:flex;align-items:center;justify-content:center;
      width:76px;height:76px;box-shadow: 0 8px 24px rgba(2,6,23,0.6);
      transition:background .12s ease;
    }
    .media-wrap:hover .play-overlay{background:rgba(0,0,0,0.55)}

    .play-overlay svg{width:28px;height:28px;fill:#fff}

    .video-title{font-weight:600;font-size:0.95rem;color:#eaf2ff;padding:6px 2px}
    .card-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end}
    .btn {
      background:transparent;border:1px solid rgba(255,255,255,0.06);
      color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;
    }
    .btn:active{transform:translateY(1px)}

    /* close button top-right when playing */
    .close-btn{
      position:absolute;right:8px;top:8px;background:rgba(0,0,0,0.45);border-radius:8px;padding:6px;border:1px solid rgba(255,255,255,0.06);
      color:#fff;cursor:pointer;z-index:30;
    }

    /* Responsive */
    @media (max-width:940px){
      .video-grid{grid-template-columns: repeat(2,1fr)}
    }
    @media (max-width:560px){
      .video-grid{grid-template-columns: 1fr}
      .top-bar{padding:12px}
      .main{padding:12px}
    }

    /* ensure iframe/video fills container */
    .media-iframe, .media-video{
      position:absolute; inset:0; width:100%; height:100%; border:0; display:block;
      background:#000;
    }
  </style>
</head>
<body>

<header class="top-bar">
  <div><a href="https://story.anshubaiga.com/image">← Back to albums</a></div>
  <div style="font-weight:700">VIDEO ALBUM</div>
</header>

<main class="main">
  <h2 class="album-title">Video Album</h2>

  <section class="video-grid" id="videoGrid">
    <!-- YouTube thumbnail example (we'll use data attributes to initialize) -->
    <div class="video-card" data-type="youtube" data-id="dQw4w9WgXcQ">
      <div class="media-wrap">
        <img class="thumb" alt="City timelapse" src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg">
        <div class="play-overlay" aria-hidden="true">
          <!-- simple play icon -->
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="video-title">City timelapse</div>
    </div>

    <div class="video-card" data-type="youtube" data-id="kXYiU_JCYtU">
      <div class="media-wrap">
        <img class="thumb" alt="Sunset walk" src="https://img.youtube.com/vi/kXYiU_JCYtU/hqdefault.jpg">
        <div class="play-overlay" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="video-title">Sunset walk</div>
    </div>

    <!-- Local MP4 example: use poster thumbnail image -->
    <div class="video-card" data-type="local" data-src="videos/sample.mp4" data-poster="https://via.placeholder.com/800x450.png?text=Local+Vlog">
      <div class="media-wrap">
        <img class="thumb" alt="My local street vlog" src="https://via.placeholder.com/800x450.png?text=Local+Vlog">
        <div class="play-overlay" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="video-title">My local street vlog</div>
    </div>

    <!-- You can add more cards following same pattern -->
  </section>
</main>

<script>
  // Delegated click handler for thumbnails
  document.getElementById('videoGrid').addEventListener('click', async function (e) {
    const thumb = e.target.closest('.thumb');
    if (!thumb) return;

    const card = thumb.closest('.video-card');
    if (!card) return;

    // If already playing, do nothing
    if (card.dataset.playing === 'true') return;

    const type = card.dataset.type;
    const wrap = card.querySelector('.media-wrap');

    // create close button
    const close = document.createElement('button');
    close.className = 'close-btn';
    close.innerHTML = '✕';
    close.title = 'Close';
    close.addEventListener('click', () => {
      stopAndRestore(card);
    });

    // replace thumbnail with iframe/video
    if (type === 'youtube') {
      const id = card.dataset.id;
      const iframe = document.createElement('iframe');
      iframe.className = 'media-iframe';
      iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0`;
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;

      // remove existing thumb + overlay
      wrap.innerHTML = '';
      wrap.appendChild(iframe);
      wrap.appendChild(close);

      card.dataset.playing = 'true';
    } else if (type === 'local') {
      const src = card.dataset.src;
      const poster = card.dataset.poster || '';
      const video = document.createElement('video');
      video.className = 'media-video';
      video.controls = true;
      video.autoplay = true;
      if (poster) video.poster = poster;

      const source = document.createElement('source');
      source.src = src;
      source.type = 'video/mp4';
      video.appendChild(source);

      // remove existing thumb + overlay
      wrap.innerHTML = '';
      wrap.appendChild(video);
      wrap.appendChild(close);

      // attempt play (mobile may require user gesture which we already have)
      try { await video.play(); } catch (err) { console.warn('Autoplay blocked', err); }

      card.dataset.playing = 'true';
      // when video ends, restore thumbnail automatically
      video.addEventListener('ended', () => stopAndRestore(card));
    } else {
      console.warn('Unknown card type', type);
    }
  });

  function stopAndRestore(card) {
    const wrap = card.querySelector('.media-wrap');
    const type = card.dataset.type;

    // clear playing flag and remove media elements
    card.dataset.playing = 'false';
    wrap.innerHTML = '';

    // rebuild original thumbnail & play overlay depending on type
    if (type === 'youtube') {
      const id = card.dataset.id;
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = `https://img.youtube.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`;
      img.alt = card.querySelector('.video-title')?.textContent || 'Video';
      const overlay = document.createElement('div');
      overlay.className = 'play-overlay';
      overlay.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      wrap.appendChild(img);
      wrap.appendChild(overlay);
    } else if (type === 'local') {
      const poster = card.dataset.poster || 'https://via.placeholder.com/800x450.png?text=Video';
      const img = document.createElement('img');
      img.className = 'thumb';
      img.src = poster;
      img.alt = card.querySelector('.video-title')?.textContent || 'Video';
      const overlay = document.createElement('div');
      overlay.className = 'play-overlay';
      overlay.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
      wrap.appendChild(img);
      wrap.appendChild(overlay);
    }

    // ensure download/preview area hidden if you had any (none in this layout)
  }

  // Optional: initialize playing flags (false)
  document.querySelectorAll('.video-card').forEach(c => c.dataset.playing = 'false');
</script>

</body>
</html>
