<!DOCTYPE html>
<html lang="en">
<head>
  <!-- App theme color (status bar color on mobile) -->
  <meta name="theme-color" content="#0f172a" />
  <meta charset="UTF-8">
  <title>Video Album</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

  <!-- Minimal styles for thumbnails only (no other layout changes) -->
  <style>
    /* keep card as positioning container */
    .video-card { position: relative; overflow: hidden; background:transparent; }

    /* ensure consistent card media area by letting the media element (iframe/video or thumb) control height */
    /* make thumbnail fully cover the media area and not distort */
    .video-card .thumb {
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;        /* cover ensures no distortion */
      cursor:pointer;
      z-index:20;
      position:relative;      /* keep in layout flow so it reserves space */
      border-radius:6px;
    }

    /* play overlay: circular and centered */
    .video-card .thumb-overlay {
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      z-index:25;
      width:68px;
      height:68px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.45);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      cursor:pointer;
    }
    .video-card .thumb-overlay svg { width:28px; height:28px; fill:#fff; }

    /* Hide the underlying iframe/video until thumbnail clicked */
    .video-card .media-hidden { display: none; }

    /* When media is shown (not hidden) ensure it fills the width responsively */
    .video-card iframe,
    .video-card video {
      width:100%;
      height:auto; /* keep proportion; thumbnail reserves height */
      border:0;
      border-radius:6px;
      display:block;
    }

    /* On small screens keep things tidy */
    @media (max-width:560px){
      .video-card .thumb-overlay { width:60px; height:60px; }
      .video-card .thumb-overlay svg { width:24px; height:24px; }
    }
  </style>
</head>
<body>

<header class="top-bar">
  <div><a href="https://story.anshubaiga.com/image">← Back to albums</a></div>
  <div>VIDEO ALBUM</div>
</header>

<main class="main">
  <h2 class="album-title">Video Album</h2>

  <section class="video-grid">
    <!-- YouTube embeds or your own MP4s -->
    <div class="video-card" data-type="youtube" data-id="-fibzTavYWY">
      <!-- thumbnail added (click to reveal iframe) -->
      <img class="thumb" alt="City timelapse" src="https://img.youtube.com/vi/-fibzTavYWY/hqdefault.jpg">
      <div class="thumb-overlay" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
       </div>

      <!-- original iframe kept exactly as you provided, but hidden until thumbnail clicked -->
          <div class="video-card" data-type="youtube" data-id="-fibzTavYWY">
      <!-- thumbnail added (click to reveal iframe) -->
      <img class="thumb" alt="City timelapse" src="https://img.youtube.com/vi/-fibzTavYWY/hqdefault.jpg">
      <div class="thumb-overlay" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>


    <!-- Example with your own video file -->
    <div class="video-card" data-type="local" data-poster="https://via.placeholder.com/800x450.png?text=Local+Vlog">
      <img class="thumb" alt="My local street vlog" src="https://images.unsplash.com/photo-1494232410401-ad00d5433cfa?auto=format&fit=crop&w=1200&q=60">
      <div class="thumb-overlay" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>

      <!-- original video kept exactly as you provided, but hidden until thumbnail clicked -->
      <video class="media-hidden" controls>
        <source src="https://youtu.be/NVxY6SEHzxE?si=MIBf_riL7wVGqw-Z" type="video/mp4">
      </video>
      <div class="video-title">My local street vlog</div>
    </div>
  </section>
</main>

<!-- Minimal script to reveal existing media when thumbnail clicked (keeps original elements intact) -->
<script>
  (function () {
    const grid = document.querySelector('.video-grid');
    if (!grid) return;

    grid.addEventListener('click', async (ev) => {
      const thumb = ev.target.closest('.thumb');
      const overlay = ev.target.closest('.thumb-overlay');
      const trigger = thumb || overlay;
      if (!trigger) return;

      const card = trigger.closest('.video-card');
      if (!card) return;

      // find the original media element (iframe or video) inside the card
      const iframe = card.querySelector('iframe');
      const video = card.querySelector('video');

      // remove thumbnail elements
      const thumbs = card.querySelectorAll('.thumb, .thumb-overlay');
      thumbs.forEach(n => n.remove());

      // show existing media element by removing the hidden class
      if (iframe) {
        iframe.classList.remove('media-hidden');
        // append autoplay parameter to iframe src if it's YouTube
        try {
          const src = iframe.getAttribute('src') || '';
          if (src && src.indexOf('youtube.com') !== -1 && src.indexOf('autoplay=1') === -1) {
            const sep = src.includes('?') ? '&' : '?';
            iframe.src = src + sep + 'autoplay=1&rel=0';
          }
        } catch (e) { /* ignore */ }
      } else if (video) {
        video.classList.remove('media-hidden');
        // try to play (user gesture exists because click triggered)
        try { await video.play(); } catch (e) { /* autoplay blocked or other */ }
      }
    });
  })();
</script>

</body>
</html>
