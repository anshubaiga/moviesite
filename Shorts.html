<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Shorts Reel View</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #05060a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Outer wrapper */
    .reel-wrapper {
      width: 100%;
      max-width: 420px; /* Larger look on desktop */
    }

    /* Reel frame - Always 9:16 */
    .reel-frame {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: cover;
    }

    /* Tap for sound button */
    .sound-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      padding: 10px 16px;
      border-radius: 30px;
      color: #fff;
      font-size: 14px;
      backdrop-filter: blur(6px);
      cursor: pointer;
      transition: 0.3s ease;
    }

    .sound-btn:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>

  <div class="reel-wrapper">
    <div class="reel-frame">

      <!-- YOUTUBE SHORT AUTOPLAY + LOOP -->
      <iframe
        id="ytFrame"
        src="https://www.youtube.com/embed/0g5y745VmP8?autoplay=1&mute=1&controls=0&playsinline=1&loop=1&playlist=0g5y745VmP8"
        allow="play; encrypted-media"
        allowfullscreen>
      </iframe>

      <!-- SOUND BUTTON -->
      <div class="sound-btn" onclick="unmuteVideo()">
        Tap for Sound 🔊
      </div>
<div class="reel-frame">

      <!-- YOUTUBE SHORT AUTOPLAY + LOOP -->
      <iframe
        id="ytFrame"
        src="https://www.youtube.com/embed/0g5y745VmP8?autoplay=1&mute=1&controls=0&playsinline=1&loop=1&playlist=0g5y745VmP8"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>

      <!-- SOUND BUTTON -->
      <div class="sound-btn" onclick="unmuteVideo()">
        Tap for Sound 🔊
      </div>
<div class="reel-frame">

      <!-- YOUTUBE SHORT AUTOPLAY + LOOP -->
      <iframe
        id="ytFrame"
        src="https://www.youtube.com/embed/0g5y745VmP8?autoplay=1&mute=1&controls=0&playsinline=1&loop=1&playlist=0g5y745VmP8"
        allow="play; encrypted-media"
        allowfullscreen>
      </iframe>

      <!-- SOUND BUTTON -->
      <div class="sound-btn" onclick="unmuteVideo()">
        Tap for Sound 🔊
      </div>

    </div>
    </div>
    </div>
  </div>

  <script>
    function unmuteVideo() {
      const iframe = document.getElementById("ytFrame");
      iframe.src = "https://www.youtube.com/embed/0g5y745VmP8?autoplay=1&mute=0&controls=1&playsinline=1&loop=1&playlist=0g5y745VmP8";
    }
  </script>

</body>
</html>
