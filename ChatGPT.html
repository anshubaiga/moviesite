<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Style UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
    }

    /* App wrapper (centers on big screens) */
    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      padding: 10px 10px 14px;
    }

    /* ---------- HEADER ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .circle-btn,
    .pill-btn {
      border-radius: 999px;
      background: #111;
      border: 1px solid #262626;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .circle-btn {
      width: 34px;
      height: 34px;
      font-size: 16px;
    }

    .pill-btn {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ---------- MAIN CENTER ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px 4px;
    }

    .main-title {
      font-size: 22px;
      margin-bottom: 24px;
    }

    .actions {
      width: 100%;
      max-width: 420px;
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .action-btn {
      background: #111;
      border-radius: 999px;
      border: 1px solid #262626;
      padding: 10px 14px;
      font-size: 13px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .action-icon {
      font-size: 15px;
    }

    /* One column on very small screens */
    @media (max-width: 380px) {
      .actions {
        grid-template-columns: 1fr;
      }
      .main-title {
        font-size: 20px;
      }
    }

    /* ---------- INPUT AREA ---------- */
    .input-area {
      margin-top: 12px;
    }

    .input-box {
      display: flex;
      align-items: center;
      background: #111;
      border-radius: 999px;
      border: 1px solid #262626;
      padding: 8px 10px 8px 14px;
      gap: 8px;
    }

    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
    }

    .mic {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    @media (min-height: 740px) {
      .main-title {
        margin-bottom: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <div class="circle-btn">☰</div>
        <div class="pill-btn">ChatGPT</div>
      </div>
      <div class="header-right">
        <div class="circle-btn">👤</div>
        <div class="circle-btn">⟳</div>
      </div>
    </div>

    <!-- CENTER -->
    <div class="main">
      <div class="main-title">What can I help with?</div>

      <div class="actions">
        <button class="action-btn">
          <span class="action-icon">🖼️</span>
          <span>Create image</span>
        </button>

        <button class="action-btn">
          <span class="action-icon">📊</span>
          <span>Analyze data</span>
        </button>
 <!-- FOOTER INPUT -->
    <div class="input-area">
      <div class="input-box">
        <input type="text" placeholder="Ask ChatGPT" />
        <div class="mic">🎤</div>
      </div>
    </div>
  </div>
</body>
</html>
