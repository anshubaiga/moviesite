<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat GPT AI </title>
  <style>
    :root{
      --bg:#0f1724; --panel:#0b1220; --muted:#9aa6bb; --accent:#7c3aed; --user:#0ea5a4;
      --glass: rgba(255,255,255,0.03);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; background:linear-gradient(180deg,var(--bg),#071126); color:#e6eef8}
    .app{max-width:980px; margin:32px auto; display:grid; grid-template-columns:360px 1fr; gap:20px; padding:20px}

    /* Sidebar */
    .sidebar{background:var(--panel); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:12px}
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:700}
    .models{margin-top:6px;display:flex;flex-direction:column;gap:8px}
    .model{padding:10px;border-radius:10px;background:transparent;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
    .model:hover{background:rgba(255,255,255,0.02)}

    /* Chat panel */
    .panel{background:var(--panel); border-radius:16px; padding:16px; display:flex; flex-direction:column; height:72vh}
    .header{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.03)}
    .title{font-weight:600}
    .messages{flex:1; overflow:auto; padding:18px 8px; display:flex; flex-direction:column; gap:12px}

    /* message bubbles */
    .msg{max-width:78%; padding:12px 14px;border-radius:14px;line-height:1.4}
    .user{align-self:flex-end;background:linear-gradient(90deg,var(--user),#06b6d4); color:#022; border-bottom-right-radius:6px}
    .bot{align-self:flex-start;background:var(--glass); border:1px solid rgba(255,255,255,0.03)}
    .meta{font-size:12px;color:var(--muted); margin-top:6px}

    /* input area */
    .composer{display:flex;gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.03)}
    .input{flex:1; display:flex; gap:8px; align-items:center}
    textarea{width:100%; min-height:44px; max-height:150px; resize:none; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.03); background:transparent; color:inherit}
    button.send{background:var(--accent); border:none; color:white; padding:0 14px; border-radius:10px; min-height:44px; cursor:pointer}

    /* typing dots */
    .typing{display:inline-flex; gap:6px; align-items:center}
    .dot{width:8px;height:8px;border-radius:999px;background:var(--muted);opacity:0.4; animation:bounce 1s infinite}
    .dot:nth-child(2){animation-delay:0.15s}
    .dot:nth-child(3){animation-delay:0.3s}
    @keyframes bounce{0%{transform:translateY(0);opacity:0.4}50%{transform:translateY(-6px);opacity:1}100%{transform:translateY(0);opacity:0.4}}

    /* small screens */
    @media (max-width:900px){.app{grid-template-columns:1fr; padding:10px}.sidebar{order:2}.panel{order:1;height:68vh}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">G</div>
        <div>
          <div style="font-weight:700">Gemini-like AI</div>
          <div style="font-size:12px;color:var(--muted)">Local demo • HTML + CSS + JS</div>
        </div>
      </div>

      <div class="models">
        <div class="model" data-model="gpt-sim">GPT-Simulated <span style="font-size:12px;color:var(--muted)">free</span></div>
        <div class="model" data-model="gpt-4o">Fast Model <span style="font-size:12px;color:var(--muted)">beta</span></div>
        <div class="model" data-model="gpt-creative">Creative</div>
      </div>

      <div style="margin-top:auto;font-size:13px;color:var(--muted)">Tip: Replace the simulated response logic in the JS with your server call to an API (OpenAI, Anthropic, etc.).</div>
    </aside>

    <main class="panel" role="main">
      <div class="header">
        <div>
          <div class="title">Chat — Gemini-style</div>
          <div class="meta">Connected: <span id="modelName">GPT-Simulated</span></div>
        </div>
        <div style="font-size:13px;color:var(--muted)">Status: <span id="status">Ready</span></div>
      </div>

      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="chatForm" class="composer" onsubmit="return false;">
        <div class="input">
          <textarea id="input" placeholder="Ask me anything..." aria-label="Message input"></textarea>
        </div>
        <div>
          <button id="sendBtn" class="send" aria-label="Send message">Send</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    // Simple front-end demo. Replace simulateAIReply() with a call to your backend
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const modelNameEl = document.getElementById('modelName');
    const statusEl = document.getElementById('status');
     // 🔴 यहीं पर API वाला code आएगा
const reply = await sk-1234uvwx5678abcd1234uvwx5678abcd1234uvwx(text);

    document.querySelectorAll('.model').forEach(m=>{
      m.addEventListener('click', ()=>{
        document.querySelectorAll('.model').forEach(x=>x.style.opacity=1);
        m.style.opacity = 0.85;
        modelNameEl.textContent = m.textContent.trim();
      })
    })

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e)=>{ if(e.key==='sk-ijklmnop1234qrstijklmnop1234qrstijklmnop' && !e.shiftKey){ e.preventDefault(); sendMessage() } });

    function appendMessage(text, who='bot', options={}){
      const el = document.createElement('div'); el.className = 'msg '+(who==='user'?'user':'bot');
      el.innerHTML = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    function showTyping(){
      const wrap = document.createElement('div'); wrap.className='msg bot typingWrap';
      wrap.innerHTML = '<div class="typing" role="status" aria-label="AI is typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
      messagesEl.appendChild(wrap); messagesEl.scrollTop = messagesEl.scrollHeight; return wrap;
    }

    async function sendMessage(){
      const text = inputEl.value.trim(); if(!text) return;
      appendMessage(escapeHtml(text),'user'); inputEl.value='';
      statusEl.textContent = 'Thinking...';

      // simulated typing
      const typing = showTyping();
      try{
        // Replace this with an actual fetch to your server calling an LLM API.
        const reply = await sk-1234uvwx5678abcd1234uvwx5678abcd1234uvwx();
        typing.remove();
        appendMessage(escapeHtml(reply),'bot');
        statusEl.textContent = 'Ready';
      }catch(err){
        typing.remove();
        appendMessage('Error: could not get response. See console.','bot');
        statusEl.textContent = 'Error';
        console.error(err);
      }
    }

    // Simple simulated reply function. Swap this for a fetch() to your backend / LLM provider.
    function simulateAIReply(userText){
      return new Promise((resolve)=>{
        // generate a bit of "smart" variation for demo
        const base = [
          `Nice question — here's a concise answer to: "${userText}"`,
          `I can help with that. For your question about "${userText}", consider these steps...`,
          `Here's a short summary regarding "${userText}".`
        ];
        const rnd = base[Math.floor(Math.random()*base.length)];
        // mimic progressive streaming by resolving after a delay
        setTimeout(()=>resolve(rnd + '\n\n(Replace this simulated response with a real model API call.)'), 700 + Math.random()*900);
      })
    }

    // small helper
    function escapeHtml(s){ return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\n','<br>'); }

    // Example starter message
    appendMessage('<strong>Welcome!</strong> Try asking "How do I make a chatbot?"','bot');
  </script>
</body>
</html>
