<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------------- HEADER ---------------- */
    .header {
      display: flex;
      justify-content: space-between;
      padding: 12px 15px;
      align-items: center;
    }

    .header-section {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-btn {
      background: #111;
      border: 1px solid #222;
      padding: 8px 16px;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ------------- MAIN CENTER AREA ---------------- */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .center h2 {
      font-size: 24px;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
      max-width: 500px;
    }

    .big-btn {
      background: #111;
      border: 1px solid #222;
      padding: 12px 20px;
      border-radius: 30px;
      width: 47%;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
      min-width: 120px;
    }

    /* Make buttons full width on small screens */
    @media (max-width: 480px) {
      .big-btn {
        width: 100%;
      }
      .center h2 {
        font-size: 20px;
      }
      .header-btn {
        padding: 6px 12px;
        font-size: 12px;
      }
    }

    /* ------------------ INPUT AREA ------------------ */
    .bottom {
      padding: 12px;
      display: flex;
      justify-content: center;
      margin-bottom: 5px;
    }

    .input-box {
      display: flex;
      align-items: center;
      background: #111;
      border: 1px solid #222;
      border-radius: 40px;
      width: 100%;
      max-width: 700px;
      padding: 10px 15px;
      gap: 10px;
    }

    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
    }

    .mic-btn {
      background: #222;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-section">
      <div class="header-btn">☰</div>
      <div class="header-btn">ChatGPT</div>
    </div>

    <div class="header-section">
      <div class="header-btn">👤+</div>
      <div class="header-btn">⟳</div>
    </div>
  </div>

  <!-- CENTER CONTENT -->
  <div class="center">
    <h2>What can I help with?</h2>

    <div class="buttons">
      <div class="big-btn">🖼️ Create image</div>
      <div class="big-btn">📊 Analyze data</div>
 
    </div>
  </div>

  <!-- INPUT FIELD -->
  <div class="bottom">
    <div class="input-box">
      <input type="text" placeholder="Ask ChatGPT">
      <div class="mic-btn">🎤</div>
    </div>
  </div>

</body>
</html>
