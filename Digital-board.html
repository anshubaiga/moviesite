<!doctype html>

<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Digital Drawing Board</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    :root{
      --bg: #f0f4f8;
      --toolbar: #e2e8f0;
      --primary: #233147;
      --text: #1e293b;
      --card-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  touch-action: manipulation;
}

.container{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:12px;
  height:100vh;
}

.header{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
}

.title{font-size:18px;font-weight:700;margin:0}

.toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px;
  border-radius:12px;
  background:var(--toolbar);
  box-shadow:var(--card-shadow);
  flex-wrap:wrap;
  transition: transform 200ms ease, opacity 200ms ease;
}

.toolbar.hidden{transform:translateY(12px) scale(.98);opacity:0;pointer-events:none}

.tool-group{display:flex;gap:8px;align-items:center}
.tool-label{font-size:13px;font-weight:600;margin-right:4px}

.color-btn{width:36px;height:36px;border-radius:8px;border:3px solid transparent;cursor:pointer;transition:all .15s}
.color-btn.active{box-shadow:0 0 0 2px rgba(1,2,0,0.08);border-color:#000}

.size-btn{padding:6px 12px;border-radius:8px;border:2px solid transparent;font-weight:600;cursor:pointer}
.size-btn.active{border-color:rgba(0,0,0,0.08)}

.action-btn{padding:8px 14px;border-radius:10px;border:none;font-weight:700;cursor:pointer}
.clear-btn{margin-left:auto}

.canvas-wrapper{flex:1;border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow);display:flex;flex-direction:column}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;background:transparent}

/* Fullscreen mobile fallback: apply when .is-fullscreen-mobile on body */
body.is-fullscreen-mobile{
  padding:0;
  background: #000;
}
body.is-fullscreen-mobile .container{height:100vh;padding:0}
body.is-fullscreen-mobile .toolbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:40}
body.is-fullscreen-mobile .header{display:none}

/* hide browser UI space on iOS Safari when possible */
@supports (height: 100dvh) {
  .container{height:100dvh}
}

@media (max-width:720px){
  .title{font-size:16px}
  .toolbar{position:sticky}
}

@media (max-width:420px){
  .color-btn{width:30px;height:30px}
  .size-btn{padding:6px 8px;font-size:13px}
}

  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body>
  <div class="container" id="app">
   <div class="header" id="header">
    <h1 class="title" id="board-title">Digital Drawing Board</h1>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="undo-btn" class="action-btn" title="Undo (last stroke)">Undo</button>
      <button id="fullscreen-btn" class="action-btn" title="Toggle fullscreen">Fullscreen</button>
      <button id="download-btn" class="action-btn" style="background:var(--primary);color:#fff">Download PNG</button>
    </div>
   </div>   <div class="toolbar" id="toolbar">
     <div class="tool-group"><span class="tool-label">Color:</span>
       <button class="color-btn active" data-color="#000000" style="background-color:#000000"></button>
       <button class="color-btn" data-color="#FF0000" style="background-color:#FF0000"></button>
       <button class="color-btn" data-color="#00FF00" style="background-color:#00FF00"></button>
       <button class="color-btn" data-color="#0000FF" style="background-color:#0000FF"></button>
       <button class="color-btn" data-color="#FFFF00" style="background-color:#FFFF00"></button>
       <button class="color-btn" data-color="#FFFFFF" style="background-color:#FFFFFF;border:2px solid #ddd"></button>
     </div><div class="tool-group"><span class="tool-label">Size:</span>
   <button class="size-btn" data-size="2">Thin</button>
   <button class="size-btn active" data-size="5">Medium</button>
   <button class="size-btn" data-size="10">Thick</button>
   <button class="size-btn" data-size="20">Bold</button>
 </div>

 <div class="tool-group">
   <label class="tool-label" style="margin:0">Mode:</label>
   <button id="pen-btn" class="size-btn active">Pen</button>
   <button id="eraser-btn" class="size-btn">Eraser</button>
 </div>

 <button class="action-btn clear-btn" id="clear-btn">Clear Board</button>

   </div>   <div class="canvas-wrapper">
     <canvas id="drawing-canvas"></canvas>
   </div>
  </div>  <script>
    const defaultConfig = {
      background_color: "#f0f4f8",
      toolbar_color: "#e2e8f0",
      primary_action_color: "#3b82f6",
      text_color: "#1e293b",
      board_title: "Digital Drawing Board",
      clear_button_text: "Clear Board",
      font_family: "Inter",
      font_size: 16
    };

    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let isDrawing = false; let currentColor = '#000000'; let currentSize = 5; let lastX=0,lastY=0; let mode='pen';
    const history=[]; const maxHistory=20;

    function pushHistory(){ try{ if(history.length>=maxHistory) history.shift(); history.push(canvas.toDataURL()); }catch(e){} }
    function restoreFromHistory(){ if(!history.length) return; const data=history.pop(); const img=new Image(); img.onload=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0,canvas.width,canvas.height); }; img.src=data; }

    // Resize handling using VisualViewport for mobile chrome/ios
    function resizeCanvas(){
      const wrapper = canvas.parentElement; const rect = wrapper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const temp = document.createElement('canvas'); temp.width = canvas.width; temp.height = canvas.height; const tctx = temp.getContext('2d'); tctx.drawImage(canvas,0,0);
      // Use CSS pixels * DPR for internal size
      canvas.width = Math.max(300, Math.floor(rect.width * dpr));
      canvas.height = Math.max(150, Math.floor(rect.height * dpr));
      canvas.style.width = rect.width + 'px'; canvas.style.height = rect.height + 'px';
      if(temp.width && temp.height){ ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(temp,0,0,canvas.width,canvas.height); }
      ctx.lineCap='round'; ctx.lineJoin='round';
    }

    // When in mobile fullscreen (CSS fallback) adjust to visualViewport
    if(window.visualViewport){ window.visualViewport.addEventListener('resize', ()=>{ if(document.body.classList.contains('is-fullscreen-mobile')) resizeCanvas(); }); }
    window.addEventListener('orientationchange', ()=> setTimeout(resizeCanvas,120));

    function getPos(e){ const rect=canvas.getBoundingClientRect(); let clientX,clientY; if(e.touches && e.touches[0]){ clientX=e.touches[0].clientX; clientY=e.touches[0].clientY; } else { clientX=e.clientX; clientY=e.clientY; }
      const x=(clientX-rect.left)*(canvas.width/rect.width); const y=(clientY-rect.top)*(canvas.height/rect.height); return {x,y}; }

    function startDrawing(e){ e.preventDefault(); pushHistory(); isDrawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; }
    function draw(e){ if(!isDrawing) return; e.preventDefault(); const p=getPos(e); const currentX=p.x,currentY=p.y; ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(currentX,currentY); ctx.strokeStyle=(mode==='pen')?currentColor: (defaultConfig.background_color||'#ffffff'); ctx.lineWidth=currentSize*(window.devicePixelRatio||1); ctx.stroke(); lastX=currentX; lastY=currentY; }
    function stopDrawing(){ if(!isDrawing) return; isDrawing=false; }

    canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); window.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, {passive:false}); canvas.addEventListener('touchmove', draw, {passive:false}); window.addEventListener('touchend', stopDrawing);

    document.querySelectorAll('.color-btn').forEach(btn=>{ btn.addEventListener('click', function(){ document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active')); this.classList.add('active'); currentColor=this.dataset.color; mode='pen'; document.getElementById('pen-btn').classList.add('active'); document.getElementById('eraser-btn').classList.remove('active'); }); });
    document.querySelectorAll('.size-btn').forEach(btn=>{ btn.addEventListener('click', function(){ document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active')); this.classList.add('active'); currentSize=parseInt(this.dataset.size||5); }); });
    document.getElementById('pen-btn').addEventListener('click', ()=>{ mode='pen'; document.getElementById('pen-btn').classList.add('active'); document.getElementById('eraser-btn').classList.remove('active'); });
    document.getElementById('eraser-btn').addEventListener('click', ()=>{ mode='eraser'; document.getElementById('eraser-btn').classList.add('active'); document.getElementById('pen-btn').classList.remove('active'); });

    document.getElementById('clear-btn').addEventListener('click', ()=>{ pushHistory(); ctx.clearRect(0,0,canvas.width,canvas.height); });
    document.getElementById('undo-btn').addEventListener('click', ()=>{ restoreFromHistory(); });

    // Download
    document.getElementById('download-btn').addEventListener('click', ()=>{ const exportCanvas=document.createElement('canvas'); exportCanvas.width=canvas.width; exportCanvas.height=canvas.height; const ectx=exportCanvas.getContext('2d'); ectx.drawImage(canvas,0,0,exportCanvas.width,exportCanvas.height); const url=exportCanvas.toDataURL('image/png'); const a=document.createElement('a'); a.href=url; a.download=(document.getElementById('board-title').textContent||'drawing')+'.png'; document.body.appendChild(a); a.click(); a.remove(); });

    // Fullscreen handling with mobile fallbacks
    const fsBtn=document.getElementById('fullscreen-btn');
    async function requestFullscreenBehavior(){
      // Standard fullscreen first
      const elem=document.documentElement;
      if(document.fullscreenEnabled){
        if(!document.fullscreenElement){
          try{ await elem.requestFullscreen(); }
          catch(e){ /* ignore */ }
      } else { // exit
        try{ await document.exitFullscreen(); } catch(e){}
      }
      }
    }

    // iOS Safari doesn't support requestFullscreen reliably. Provide CSS fallback that pins the page.
    function enterMobileCssFullscreen(){
      document.body.classList.add('is-fullscreen-mobile');
      // set viewport-fitting to cover notch areas
      document.documentElement.style.height='100%';
      document.documentElement.style.overflow='hidden';
      document.body.style.overflow='hidden';
      resizeCanvas();
    }
    function exitMobileCssFullscreen(){
      document.body.classList.remove('is-fullscreen-mobile');
      document.documentElement.style.overflow=''; document.body.style.overflow='';
      resizeCanvas();
    }

    fsBtn.addEventListener('click', async ()=>{
      // Try standard fullscreen first
      if(document.fullscreenEnabled){
        if(!document.fullscreenElement){
          try{ await document.documentElement.requestFullscreen(); return; } catch(e){}
        } else { try{ await document.exitFullscreen(); return; } catch(e){} }
      }

      // Fallback: use CSS fullscreen for mobile (iOS/older browsers)
      if(!document.body.classList.contains('is-fullscreen-mobile')) enterMobileCssFullscreen(); else exitMobileCssFullscreen();
    });

    // When real fullscreen changes, adjust canvas and toolbar
    document.addEventListener('fullscreenchange', ()=>{ setTimeout(resizeCanvas,80); });

    // Tap to show/hide toolbar in fullscreen mobile mode
    let toolbarTimeout=null; const toolbarEl=document.getElementById('toolbar');
    function showToolbarOnce(){ if(!document.body.classList.contains('is-fullscreen-mobile') && !document.fullscreenElement) return; toolbarEl.classList.remove('hidden'); if(toolbarTimeout) clearTimeout(toolbarTimeout); toolbarTimeout=setTimeout(()=>{ toolbarEl.classList.add('hidden'); }, 3000); }

    // Single-tap anywhere (not on buttons) toggles toolbar visibility briefly
    document.getElementById('app').addEventListener('click', (e)=>{
      // ignore clicks on toolbar controls
      if(e.target.closest('#toolbar') || e.target.closest('#header')) return;
      if(document.fullscreenElement || document.body.classList.contains('is-fullscreen-mobile')){
        if(toolbarEl.classList.contains('hidden')) showToolbarOnce(); else { toolbarEl.classList.add('hidden'); if(toolbarTimeout) clearTimeout(toolbarTimeout); }
      }
    });

    // Initialize: hide toolbar in fullscreen mobile by default
    function initFullscreenUI(){ if(document.fullscreenElement || document.body.classList.contains('is-fullscreen-mobile')) toolbarEl.classList.add('hidden'); else toolbarEl.classList.remove('hidden'); }

    // Safe initial resize
    window.addEventListener('load', ()=>{ resizeCanvas(); initFullscreenUI(); });
    window.addEventListener('resize', ()=>{ resizeCanvas(); initFullscreenUI(); });
    setTimeout(()=>{ resizeCanvas(); },100);

    // Element SDK integration
    async function onConfigChange(newConfig){ const cfg={...defaultConfig,...newConfig}; document.body.style.background=cfg.background_color||defaultConfig.background_color; document.getElementById('toolbar').style.background=cfg.toolbar_color||defaultConfig.toolbar_color; document.getElementById('download-btn').style.background=cfg.primary_action_color||defaultConfig.primary_action_color; document.getElementById('download-btn').style.color='#fff'; document.querySelector('.title').style.color=cfg.text_color||defaultConfig.text_color; document.getElementById('board-title').textContent=cfg.board_title||defaultConfig.board_title; document.getElementById('clear-btn').textContent=cfg.clear_button_text||defaultConfig.clear_button_text; }
    if(window.elementSdk){ window.elementSdk.init({ defaultConfig, onConfigChange, mapToCapabilities:()=>({recolorables:[],borderables:[],fontEditable:{get:()=>defaultConfig.font_family,set:()=>{}},fontSizeable:{get:()=>defaultConfig.font_size,set:()=>{}} }), mapToEditPanelValues:()=>new Map() }); }
  </script></body>
</html>
